<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays, DOM e Eventos</title>
    <style>
        .destaque {
            font-weight: bold;
        }

        .feito {
            text-decoration: line-through;
        }
    </style>
</head>
<body>
    <h1 id="titulo">Meu Blog</h1>

    <p class="texto">Primeiro parágrafo.</p>
    <p class="texto">Segundo parágrafo.</p>

    <ul id="lista">
        <li>Item inicial 1</li>
        <li>Item inicial 2</li>
        <li>Item inicial 3</li>
    </ul>

    <button id="botao">Clique aqui</button>

    <input type="text" id="nome" placeholder="Digite seu nome">

    <form id="formulario">
        <input type="text" id="tarefa" placeholder="Digite uma tarefa">
        <button type="submit">Adicionar tarefa</button>
    </form>

    <script src="app.js"></script>
</body>
</html>
